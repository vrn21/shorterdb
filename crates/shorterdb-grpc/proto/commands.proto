syntax = "proto3";

package commands;

service Basic{
    rpc Get (GetRequest) returns (GetResponse);
    rpc Set (SetRequest) returns (SetResponse);
    rpc Delete (DelRequest) returns (DelResponse);
}

message GetRequest{
    string key = 1;
}

message GetResponse{
    string value = 1;
}

message SetRequest{
    string key = 1;
    string value = 2;
}

message SetResponse{
    bool success = 1;
}

message DelRequest{
    string key = 1;
}

message DelResponse{
    bool key_existed = 1;
}
