services:
  shorterdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shorterdb-grpc
    ports:
      - "50051:50051"
    volumes:
      - shorterdb-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - RUST_LOG=info

volumes:
  shorterdb-data:
    driver: local
