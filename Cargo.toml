[workspace]
resolver = "2"
members = [
    "crates/shorterdb",
    "crates/shorterdb-grpc",
    "crates/examples",
]

# Shared metadata for crates.io publishing
[workspace.package]
version = "0.2.0"
authors = [
    "K V Varun Krishnan <hello@vrn21.com>",
    "M Arjun Krishna <arjunkrishna7356@gmail.com>",
]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hrefto/shorterdb"

# Shared dependencies (DRY)
[workspace.dependencies]
bytes = "1.7"
crossbeam-skiplist = "0.1"
thiserror = "1.0"
log = "0.4"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
tonic-web = "0.11"
prost = "0.12"
tower-http = { version = "0.3", features = ["cors"] }

# Local crate references
shorterdb = { path = "crates/shorterdb" }
